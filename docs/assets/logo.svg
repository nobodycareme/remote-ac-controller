<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- Phone -->
  <rect x="8" y="22" width="16" height="36" rx="3" stroke="url(#g)" stroke-width="1.8" fill="none"/>
  <rect x="13" y="27" width="6" height="6" rx="1" fill="url(#g)"/>
  <rect x="13" y="37" width="6" height="2" rx="1" fill="url(#g)" opacity="0.5"/>
  <rect x="13" y="42" width="6" height="2" rx="1" fill="url(#g)" opacity="0.5"/>
  <!-- WiFi arcs -->
  <path d="M32 44 Q38 36 44 44" stroke="url(#g)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M34 40 Q38 34 42 40" stroke="url(#g)" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <circle cx="38" cy="47" r="1.2" fill="url(#g)"/>
  <!-- AC unit -->
  <rect x="52" y="20" width="40" height="36" rx="4" stroke="url(#g)" stroke-width="1.8" fill="none"/>
  <rect x="60" y="28" width="24" height="4" rx="1" fill="url(#g)" opacity="0.6"/>
  <rect x="60" y="38" width="16" height="3" rx="1" fill="url(#g)" opacity="0.4"/>
  <rect x="65" y="48" width="8" height="2" rx="1" fill="url(#g)" opacity="0.3"/>
  <!-- IR rays -->
  <path d="M92 38 L100 30 M92 40 L100 40 M92 42 L100 50" stroke="url(#g)" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- Thermometer -->
  <rect x="110" y="28" width="3" height="16" rx="1.5" stroke="url(#g)" stroke-width="1.2" fill="none"/>
  <circle cx="111.5" cy="46" r="3.5" stroke="url(#g)" stroke-width="1.2" fill="none"/>
  <rect x="110" y="33" width="3" height="4" rx="1" fill="url(#g)"/>
  <!-- Text -->
  <text x="130" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="url(#g)">Remote AC</text>
  <text x="130" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94A3B8" letter-spacing="0.5">CONTROLLER</text>
