  # ---------------------------------------------------------------------------
  # v1.2.5 independent release gates (five checks; total workflow checks = 16)
  # ---------------------------------------------------------------------------
  v125-mqtt-tls-policy:
    name: v125-mqtt-tls-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run MQTT TLS policy
        run: |
          g++ -std=c++11 -Wall -I firmware/shared/RemoteACCore/src \
            test/host/test_mqtt_tls_policy.cpp -o /tmp/test_mqtt_tls_policy
          /tmp/test_mqtt_tls_policy | tee /tmp/tls.txt
          grep -q 'MQTT_TLS_POLICY_CASE_FAILURE=0' /tmp/tls.txt

  v125-wifi-ssid-parity:
    name: v125-wifi-ssid-parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Python and C++ SSID parity
