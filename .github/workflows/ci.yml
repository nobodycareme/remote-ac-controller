  v126-reproducibility-contract:
    name: v126-reproducibility-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Static reproducibility and Owner contract
        run: |
          python3 tools/check-v126-reproducibility.py
          python3 tools/test-v126-reproducibility-negative.py

      - name: Scrypt generator self-test
        run: node cloud/tools/generate-scrypt-hash.mjs --self-test

      - name: Compose static parse
        working-directory: cloud
        run: |
          cp deploy/secrets.env.example deploy/secrets.env
          docker compose config >/dev/null
          rm deploy/secrets.env

  v126-compose-integration:
    name: v126-compose-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create fake credentials and ephemeral test PKI
        working-directory: cloud
        run: |
          set -euo pipefail
          cat > deploy/secrets.env <<'EOF'
          MQTT_DEVICE_USERNAME=remote-ac-device
          MQTT_DEVICE_PASSWORD=FAKE_CI_ONLY_device-pass-123
          MQTT_USERNAME=remote-ac-backend
          MQTT_PASSWORD=FAKE_CI_ONLY_backend-pass-123
          WEB_USER=admin
          WEB_PASSWORD=FAKE_CI_ONLY_owner-pass-123
          SESSION_SECRET=FAKE_CI_ONLY_session-secret-123
          EOF
          mkdir -p broker/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -sha256 \
            -subj '/CN=Remote AC CI Test CA' \
            -keyout broker/certs/ca.key -out broker/certs/ca.crt
          openssl req -newkey rsa:2048 -nodes -sha256 \
            -subj '/CN=localhost' \
            -keyout broker/certs/server.key -out broker/certs/server.csr
          printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' > broker/certs/server.ext
          openssl x509 -req -days 1 -sha256 \
            -in broker/certs/server.csr -CA broker/certs/ca.crt -CAkey broker/certs/ca.key \
            -CAcreateserial -extfile broker/certs/server.ext -out broker/certs/server.crt
          chmod 644 broker/certs/server.key

      - name: Pull pinned broker and build backend
        working-directory: cloud
        run: |
          docker compose pull broker
          docker compose build --no-cache backend

      - name: Start stack and wait for health
        working-directory: cloud
        run: |
          set -euo pipefail
          docker compose up -d
          for attempt in $(seq 1 60); do
            broker_health=$(docker inspect --format '{{.State.Health.Status}}' remote-ac-broker 2>/dev/null || true)
            backend_health=$(docker inspect --format '{{.State.Health.Status}}' remote-ac-backend 2>/dev/null || true)
            if [ "$broker_health" = healthy ] && [ "$backend_health" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Verify authenticated broker health and ACL boundaries
        working-directory: cloud
        run: |
          set -euo pipefail
          docker exec remote-ac-broker mosquitto_sub -h 127.0.0.1 -p 1883 \
            -u remote-ac-backend -P FAKE_CI_ONLY_backend-pass-123 \
            -t '$SYS/broker/version' -C 1 -W 3 >/dev/null
          if docker exec remote-ac-broker mosquitto_sub -h 127.0.0.1 -p 1883 \
            -u remote-ac-backend -P wrong-password -t '$SYS/broker/version' -C 1 -W 2; then exit 1; fi
          if docker exec remote-ac-broker mosquitto_sub -h 127.0.0.1 -p 1883 \
            -u remote-ac-device -P FAKE_CI_ONLY_device-pass-123 -t '$SYS/broker/version' -C 1 -W 2; then exit 1; fi
          docker exec remote-ac-broker mosquitto_pub -V mqttv5 -h 127.0.0.1 -p 1883 \
            -u remote-ac-device -P FAKE_CI_ONLY_device-pass-123 \
            -t remote-ac/v1/devices/bedroom-ac-01/commands/set -m '{}' -q 1
          docker logs remote-ac-broker 2>&1 | grep -E 'Denied PUBLISH.*commands/set'
          curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null
          curl --fail --silent http://127.0.0.1:3100/api/ready >/dev/null
          curl --fail --silent http://127.0.0.1:3100/api/version >/dev/null

      - name: Cleanup Compose resources
        if: always()
        working-directory: cloud
        run: |
          docker compose logs --no-color || true
          docker compose down -v --remove-orphans || true
          rm -f deploy/secrets.env
          rm -rf broker/certs

  # ---------------------------------------------------------------------------
  # repo-hygiene
  # ---------------------------------------------------------------------------
  # Fast, dependency-free guard against the classes of files that must never be
  # published from this project.
  repo-hygiene:
    name: repo-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert excluded directories are absent
        run: |
          set -euo pipefail
          fail=0
          for d in Private Evidence _QUARANTINE_ ; do
            if [ -e "$d" ]; then
              echo "EXCLUDED_DIR_PRESENT: $d"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "OK  no excluded directories"

      - name: Assert no key / certificate / database artefacts are tracked
        run: |
          set -euo pipefail
          pattern='\.(pem|key|p12|pfx|db|sqlite|sqlite3|bundle)$'
          if git ls-files | grep -Ei "$pattern" ; then
            echo "FORBIDDEN_ARTEFACT_TRACKED"
            exit 1
          fi
          echo "OK  no key/cert/database artefacts tracked"

      - name: Assert LICENSE and NOTICE are present
        run: |
          set -euo pipefail
          test -f LICENSE || { echo "LICENSE_MISSING"; exit 1; }
          test -f NOTICE  || { echo "NOTICE_MISSING"; exit 1; }
          grep -q 'Apache License' LICENSE || { echo "LICENSE_NOT_APACHE"; exit 1; }
          echo "OK  Apache-2.0 LICENSE and NOTICE present"

      - name: Assert srun-c has exactly one authoritative source tree
        run: |
          set -euo pipefail
          # Every tracked srun-c translation unit must live under the single
          # canonical directory. A second tracked copy (e.g. a flattened Arduino
          # duplicate) would create two divergent authorities for one protocol.
          CANON='firmware/agent-platformio/lib/srun-c'
          stray=$(git ls-files -- '*srun*' \
                  | grep -E '\.(c|h|cpp)$' \
                  | grep -v "^${CANON}/" \
                  | grep -v '\.example\.h$' || true)
          if [ -n "$stray" ]; then
            echo "SRUN_DUPLICATE_TRACKED_SOURCE:"
            printf '%s\n' "$stray"
            exit 1
          fi
          count=$(git ls-files -- "${CANON}" | grep -cE '\.(c|h|cpp)$')
          echo "SRUN_CANONICAL_SOURCE_PATH=${CANON}"
          echo "SRUN_CANONICAL_TRANSLATION_UNITS=${count}"
          echo "SRUN_DUPLICATE_TRACKED_SOURCE_COUNT=0"
          echo "SRUN_SINGLE_SOURCE_PASS=True"
          test -f "${CANON}/LICENSE" || { echo "SRUN_LICENSE_MISSING"; exit 1; }
          echo "SRUN_LICENSE_PRESERVED=True"

      - name: srun-c Arduino adapter is deterministic and fails closed
        run: |
          set -euo pipefail
          OUT=$(mktemp -d)
          python3 tools/prepare_srun_arduino_library.py --output "$OUT" --verify-deterministic

          # The generated library must never be written into the working tree.
          python3 tools/prepare_srun_arduino_library.py --output . 2>/dev/null \
            && { echo 'ADAPTER_WROTE_INTO_REPO=True'; exit 1; } \
            || echo 'ADAPTER_REFUSES_TO_WRITE_INTO_REPO=True'

          # Fail-closed: an unreviewed source file must abort the generation.
          echo '/* stray */' > firmware/agent-platformio/lib/srun-c/src/unreviewed.c
          set +e
          python3 tools/prepare_srun_arduino_library.py --output "$OUT" 2>/dev/null
          rc=$?
          set -e
          rm -f firmware/agent-platformio/lib/srun-c/src/unreviewed.c
          [ "$rc" -ne 0 ] || { echo 'ADAPTER_ACCEPTED_UNKNOWN_SOURCE=True'; exit 1; }
          echo 'ADAPTER_REJECTS_UNKNOWN_SOURCE=True'
          git diff --quiet -- firmware/agent-platformio/lib/srun-c
          echo 'SRUN_ADAPTER_DETERMINISTIC_PASS=True'

      - name: PCB Rev 1.0.1 release contract
        run: |
          set -euo pipefail
          python3 tools/check-pcb-release.py
          python3 tools/check-pcb-release.py --negative-test
          python3 tools/check-pcb-release.py --determinism-test

