name: CI

# Monorepo CI for remote-ac-controller.
#
# Scope and safety rules (enforced by review, not by CI itself):
#   - This workflow NEVER touches production, never deploys, never flashes hardware.
#   - This workflow NEVER consumes repository/organization secrets.
#   - Only the public build profile is exercised for firmware.
#   - Real-IR transmission, private profiles and production credentials are out of scope.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only. No packages, no id-token, no write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # firmware-ci
  # ---------------------------------------------------------------------------
  # The firmware toolchain (PlatformIO Core + xtensa) is provisioned locally
  # under Environment/PlatformIO and is intentionally NOT vendored into this
  # public repository. A hosted runner therefore cannot produce a byte-identical
  # firmware image. This job performs the checks that ARE reproducible in CI:
  #   1. static repository hygiene (no secrets header committed)
  #   2. firmware source/structure sanity
  #   3. dev.ps1 contract check (the only supported entry point)
  # Full compilation is performed locally via: tools/build-all.ps1
  firmware-platformio-public:
    name: firmware-platformio-public
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify firmware layout
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $required = @(
            'firmware/agent-platformio/platformio.ini',
            'firmware/agent-platformio/src/main.cpp',
            'firmware/shared/RemoteACCore/src/config/cloud_secrets.example.h',
            'firmware/agent-platformio/tools/dev.ps1',
            'firmware/shared/RemoteACCore/library.properties',
            'firmware/shared/RemoteACCore/src/RemoteACApp.h',
            'firmware/arduino-ide/Remote_AC_Controller/Remote_AC_Controller.ino'
          )
          foreach ($p in $required) {
            if (-not (Test-Path -LiteralPath $p)) {
              Write-Error "FIRMWARE_LAYOUT_FAIL: missing $p"
            }
            Write-Output "OK  $p"
          }

      - name: Assert no firmware secrets are committed
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $forbidden = @(
            'firmware/agent-platformio/include/secrets.h',
            'firmware/shared/RemoteACCore/src/config/cloud_secrets.h',
            'firmware/shared/RemoteACCore/src/cloud_secrets.h',
            'firmware/agent-platformio/include/cloud_secrets.h'
          )
          $bad = @()
          foreach ($p in $forbidden) {
            if (Test-Path -LiteralPath $p) { $bad += $p }
          }
          if ($bad.Count -gt 0) {
            Write-Error "SECRETS_COMMITTED: $($bad -join ', ')"
          }
          Write-Output 'OK  no secrets header committed'

      - name: Verify dev.ps1 exposes the documented contract
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $src = Get-Content -LiteralPath 'firmware/agent-platformio/tools/dev.ps1' -Raw
          foreach ($cmd in @('build', 'verify', 'test', 'status')) {
            if ($src -notmatch [regex]::Escape("'$cmd'")) {
              Write-Error "DEVPS1_CONTRACT_FAIL: command '$cmd' not found in ValidateSet"
            }
            Write-Output "OK  dev.ps1 command '$cmd'"
          }
          if ($src -notmatch [regex]::Escape("'public'")) {
            Write-Error "DEVPS1_CONTRACT_FAIL: profile 'public' not found"
          }
          Write-Output "OK  dev.ps1 profile 'public'"

      - name: Setup Python for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          pio --version

      - name: dev.ps1 verify (public profile)
        run: pwsh firmware/agent-platformio/tools/dev.ps1 verify -Profile public

      - name: dev.ps1 test (public profile)
        run: pwsh firmware/agent-platformio/tools/dev.ps1 test -Profile public

      - name: dev.ps1 build (public profile, artifact secret-scanned)
        run: pwsh firmware/agent-platformio/tools/dev.ps1 build -Profile public

      - name: v1.2.5 local-wifi-cloud real compile (CA-only / fingerprint-only)
        run: |
          $ErrorActionPreference = 'Continue'
          # Temporary, obvious CI test values. Never GitHub secrets.
          $wifi = 'firmware/shared/RemoteACCore/src/config/wifi_secrets.h'
          $cloud = 'firmware/shared/RemoteACCore/src/config/cloud_secrets.h'
          # Escaped \n inside the C string literal (like cloud_secrets.example.h)
          # so the PEM stays on ONE preprocessor line.
          $ca = '-----BEGIN CERTIFICATE-----\nMIIB\n-----END CERTIFICATE-----'
          $fp = 'F4:BD:59:32:8E:77:8C:CB:AD:6E:AE:85:86:59:36:FD:0D:28:47:F9'

          Set-Content -LiteralPath $wifi -Value @(
            '#pragma once',
            '#define LOCAL_WIFI_SSID     "Home WiFi CI"',
            '#define LOCAL_WIFI_PASSWORD "CI-TEST-PASSWORD-123"'
          ) -Encoding UTF8

          try {
            # --- 12.1 CA-only real compile ---------------------------------
            Set-Content -LiteralPath $cloud -Value @(
              '#pragma once',
              '#define MQTT_BROKER_HOST "mqtt.ci-test.example.net"',
              '#define MQTT_BROKER_PORT 8883',
              '#define MQTT_DEVICE_ID "ci-test-device-01"',
              '#define MQTT_USERNAME "ci-test-user-01"',
              '#define MQTT_PASSWORD "ci-test-password-2026"',
              "#define MQTT_CA_CERT `"$ca`"",
              '#define MQTT_TLS_FINGERPRINT ""'
            ) -Encoding UTF8
            $out = pwsh firmware/agent-platformio/tools/dev.ps1 build -Profile local-wifi-cloud 2>&1
            $out | Out-String | Write-Output
            if ($LASTEXITCODE -ne 0) { throw "LWC_CA_ONLY_BUILD_FAILED rc=$LASTEXITCODE" }
            Write-Output 'MQTT_TLS_CA_ONLY_COMPILE_PASS=True'

            # --- 12.2 fingerprint-only real compile -------------------------
            Set-Content -LiteralPath $cloud -Value @(
              '#pragma once',
              '#define MQTT_BROKER_HOST "mqtt.ci-test.example.net"',
              '#define MQTT_BROKER_PORT 8883',
              '#define MQTT_DEVICE_ID "ci-test-device-01"',
              '#define MQTT_USERNAME "ci-test-user-01"',
              '#define MQTT_PASSWORD "ci-test-password-2026"',
              '#define MQTT_CA_CERT ""',
              "#define MQTT_TLS_FINGERPRINT `"$fp`""
            ) -Encoding UTF8
            $out = pwsh firmware/agent-platformio/tools/dev.ps1 build -Profile local-wifi-cloud 2>&1
            $out | Out-String | Write-Output
            if ($LASTEXITCODE -ne 0) { throw "LWC_FP_ONLY_BUILD_FAILED rc=$LASTEXITCODE" }
            Write-Output 'MQTT_TLS_FINGERPRINT_ONLY_COMPILE_PASS=True'

            # --- 12.4 both valid: still compiles (CA path is chosen) --------
            Set-Content -LiteralPath $cloud -Value @(
              '#pragma once',
              '#define MQTT_BROKER_HOST "mqtt.ci-test.example.net"',
              '#define MQTT_BROKER_PORT 8883',
              '#define MQTT_DEVICE_ID "ci-test-device-01"',
              '#define MQTT_USERNAME "ci-test-user-01"',
              '#define MQTT_PASSWORD "ci-test-password-2026"',
              "#define MQTT_CA_CERT `"$ca`"",
              "#define MQTT_TLS_FINGERPRINT `"$fp`""
            ) -Encoding UTF8
            $out = pwsh firmware/agent-platformio/tools/dev.ps1 build -Profile local-wifi-cloud 2>&1
            $out | Out-String | Write-Output
            if ($LASTEXITCODE -ne 0) { throw "LWC_BOTH_VALID_BUILD_FAILED rc=$LASTEXITCODE" }
            Write-Output 'MQTT_TLS_BOTH_VALID_COMPILE_PASS=True'

            # --- 12.3 no TLS material: pre-flight validation must reject ----
            Set-Content -LiteralPath $cloud -Value @(
              '#pragma once',
              '#define MQTT_BROKER_HOST "mqtt.ci-test.example.net"',
              '#define MQTT_BROKER_PORT 8883',
              '#define MQTT_DEVICE_ID "ci-test-device-01"',
              '#define MQTT_USERNAME "ci-test-user-01"',
              '#define MQTT_PASSWORD "ci-test-password-2026"',
              '#define MQTT_CA_CERT ""',
              '#define MQTT_TLS_FINGERPRINT ""'
            ) -Encoding UTF8
            $out = pwsh firmware/agent-platformio/tools/dev.ps1 build -Profile local-wifi-cloud 2>&1
            $out | Out-String | Write-Output
            if ($LASTEXITCODE -eq 0) { throw 'LWC_NO_TLS_BUILD_SUCCEEDED (must be rejected)' }
            if (($out | Out-String) -notmatch 'TLS_MATERIAL_MISSING') {
              throw "LWC_NO_TLS_WRONG_ERROR: $out"
            }
            Write-Output 'MQTT_TLS_NO_MATERIAL_REJECTED=True'
          }
          finally {
            Remove-Item $wifi -ErrorAction SilentlyContinue
            Remove-Item $cloud -ErrorAction SilentlyContinue
          }
          exit 0

      - name: dev.ps1 profile contract + secret content validation (v1.2.4)
        run: |
          $ErrorActionPreference = 'Continue'
          python tools/test-devps1-profile-contract.py
          python tools/validate-cloud-secrets.py --self-test
          # Negative: a template wifi_secrets.h must FAIL content validation
          # (existence is not enough), and dev.ps1 must refuse to build.
          $wifi = 'firmware/shared/RemoteACCore/src/config/wifi_secrets.h'
          $example = 'firmware/shared/RemoteACCore/src/config/wifi_secrets.example.h'
          Copy-Item $example $wifi
          try {
            $out = pwsh firmware/agent-platformio/tools/dev.ps1 build -Profile local-wifi 2>&1
            $rc = $LASTEXITCODE
            Write-Output ($out | Out-String)
            $vline = ($out | Select-String -Pattern 'WIFI_SECRETS_VALID').Line
            if ($rc -eq 0) {
              throw 'TEMPLATE_WIFI_SECRETS_ACCEPTED=True (must be rejected)'
            }
            if ($vline -notmatch 'WIFI_SECRETS_VALID=False') {
              throw "TEMPLATE_WIFI_SECRETS_NOT_REJECTED: $vline"
            }
            Write-Output 'TEMPLATE_WIFI_SECRETS_REJECTED=True'
          }
          finally {
            Remove-Item $wifi -ErrorAction SilentlyContinue
          }
          exit 0

      - name: v1.2.5 SSID/TLS build-time validation matrix (test values only)
        run: |
          $ErrorActionPreference = 'Continue'
          python tools/validate-cloud-secrets.py --self-test

          # --- helper: write a temporary (git-ignored) wifi_secrets.h -------
          $wifi = 'firmware/shared/RemoteACCore/src/config/wifi_secrets.h'
          function Write-WifiSecrets([string]$ssid, [string]$pwd) {
            $lines = @(
              '#pragma once',
              "#define LOCAL_WIFI_SSID     `"$ssid`"",
              "#define LOCAL_WIFI_PASSWORD `"$pwd`""
            )
            Set-Content -LiteralPath $wifi -Value $lines -Encoding UTF8
          }

          # 1) SSID with an internal space is ACCEPTED (no longer rejected)
          Write-WifiSecrets 'Home WiFi' 'CI-TEST-PASSWORD-123'
          & python tools/validate-cloud-secrets.py --require-wifi --wifi $wifi | Out-String | Write-Output
          if ($LASTEXITCODE -ne 0) { throw 'SSID_INTERNAL_SPACE_REJECTED (must be accepted)' }
          Write-Output 'WIFI_SSID_INTERNAL_SPACE_PASS=True'

          # 2) exactly-32-byte SSID is ACCEPTED
          Write-WifiSecrets 'abcdefghijklmnopqrstuvwxyz012345' 'CI-TEST-PASSWORD-123'
          & python tools/validate-cloud-secrets.py --require-wifi --wifi $wifi | Out-String | Write-Output
          if ($LASTEXITCODE -ne 0) { throw 'SSID_32_BYTE_REJECTED (must be accepted)' }
          Write-Output 'WIFI_SSID_32_BYTE_PASS=True'

          # 3) 33-byte SSID is REJECTED
          Write-WifiSecrets 'abcdefghijklmnopqrstuvwxyz0123456' 'CI-TEST-PASSWORD-123'
          & python tools/validate-cloud-secrets.py --require-wifi --wifi $wifi | Out-String | Write-Output
          if ($LASTEXITCODE -eq 0) { throw 'SSID_33_BYTE_ACCEPTED (must be rejected)' }
          Write-Output 'WIFI_SSID_33_BYTE_REJECT_PASS=True'

          # 4) all-space SSID is REJECTED
          Write-WifiSecrets '      ' 'CI-TEST-PASSWORD-123'
          & python tools/validate-cloud-secrets.py --require-wifi --wifi $wifi | Out-String | Write-Output
          if ($LASTEXITCODE -eq 0) { throw 'SSID_ALL_SPACE_ACCEPTED (must be rejected)' }
          Write-Output 'WIFI_SSID_ALL_SPACE_REJECT_PASS=True'

          # 5) control-character SSID is REJECTED
          Write-WifiSecrets "My`tWiFi" 'CI-TEST-PASSWORD-123'
          & python tools/validate-cloud-secrets.py --require-wifi --wifi $wifi | Out-String | Write-Output
          if ($LASTEXITCODE -eq 0) { throw 'SSID_CONTROL_CHAR_ACCEPTED (must be rejected)' }
          Write-Output 'WIFI_SSID_CONTROL_CHARACTER_REJECT_PASS=True'
          Remove-Item $wifi -ErrorAction SilentlyContinue

          # --- helper: temporary cloud_secrets.h (obvious CI test values) ----
          $cloud = 'firmware/shared/RemoteACCore/src/config/cloud_secrets.h'
          # Escaped \n inside the C string literal (like cloud_secrets.example.h)
          # so the PEM stays on ONE preprocessor line.
          $ca = '-----BEGIN CERTIFICATE-----\nMIIB\n-----END CERTIFICATE-----'
          function Write-CloudSecrets([string]$caCert, [string]$fp) {
            $lines = @(
              '#pragma once',
              '#define MQTT_BROKER_HOST "mqtt.ci-test.example.net"',
              '#define MQTT_BROKER_PORT 8883',
              '#define MQTT_DEVICE_ID "ci-test-device-01"',
              '#define MQTT_USERNAME "ci-test-user-01"',
              '#define MQTT_PASSWORD "ci-test-password-2026"',
              "#define MQTT_CA_CERT `"$caCert`"",
              "#define MQTT_TLS_FINGERPRINT `"$fp`""
            )
            Set-Content -LiteralPath $cloud -Value $lines -Encoding UTF8
          }

          # 6) CA-only is ACCEPTED
          Write-CloudSecrets $ca ''
          & python tools/validate-cloud-secrets.py --require-cloud --cloud $cloud | Out-String | Write-Output
          if ($LASTEXITCODE -ne 0) { throw 'CLOUD_CA_ONLY_REJECTED (must be accepted)' }
          Write-Output 'MQTT_TLS_CA_ONLY_PASS=True'

          # 7) fingerprint-only is ACCEPTED
          Write-CloudSecrets '' 'F4:BD:59:32:8E:77:8C:CB:AD:6E:AE:85:86:59:36:FD:0D:28:47:F9'
          & python tools/validate-cloud-secrets.py --require-cloud --cloud $cloud | Out-String | Write-Output
          if ($LASTEXITCODE -ne 0) { throw 'CLOUD_FP_ONLY_REJECTED (must be accepted)' }
          Write-Output 'MQTT_TLS_FINGERPRINT_ONLY_PASS=True'

          # 8) no TLS material is REJECTED with TLS_MATERIAL_MISSING
          Write-CloudSecrets '' ''
          $out = & python tools/validate-cloud-secrets.py --require-cloud --cloud $cloud 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -eq 0) { throw 'CLOUD_NO_TLS_ACCEPTED (must be rejected)' }
          if ($out -notmatch 'TLS_MATERIAL_MISSING') { throw "CLOUD_NO_TLS_WRONG_CODE: $out" }
          Write-Output 'MQTT_TLS_NO_MATERIAL_REJECTED=True'

          # 9) invalid fingerprint is REJECTED with TLS_FINGERPRINT_INVALID
          Write-CloudSecrets '' 'F4:BD:59'
          $out = & python tools/validate-cloud-secrets.py --require-cloud --cloud $cloud 2>&1 | Out-String
          Write-Output $out
          if ($LASTEXITCODE -eq 0) { throw 'CLOUD_BAD_FP_ACCEPTED (must be rejected)' }
          Write-Output 'MQTT_TLS_FINGERPRINT_INVALID_REJECTED=True'
          Remove-Item $cloud -ErrorAction SilentlyContinue
          exit 0

      - name: v1.2.5 reject executable setInsecure calls
        run: python tools/check-no-insecure-tls.py --self-test

  # ---------------------------------------------------------------------------
  # firmware-arduino-public
  # ---------------------------------------------------------------------------
  # Compile the Arduino IDE sketch through the documented first-time-user
  # workflow under each public feature profile. No credentials or hardware.
  firmware-arduino-public:
    name: firmware-arduino-public (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: offline
            switches: "ENABLE_WIFI=0"
          - name: wifi-only
            switches: "ENABLE_WIFI=1"
          - name: xidian-campus-example
            switches: "ENABLE_WIFI=1 ENABLE_CAMPUS_AUTH=1 ENABLE_AUTO_CAMPUS_AUTH=0"
            profile: "profiles/xidian.example.h"
          - name: generic-srun-example
            switches: "ENABLE_WIFI=1 ENABLE_CAMPUS_AUTH=1 ENABLE_AUTO_CAMPUS_AUTH=0"
            profile: "profiles/generic_srun.example.h"
          - name: wifi-cloud-example
            switches: "ENABLE_WIFI=1 ENABLE_CLOUD=1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert the sketch carries no build-flag escape hatch
        shell: bash
        run: |
          set -euo pipefail
          SKETCH_DIR=firmware/arduino-ide/Remote_AC_Controller
          if grep -qE 'extra_flags' "$SKETCH_DIR/sketch.yaml"; then
            echo "SKETCH_YAML_EXTRA_FLAGS_PRESENT=True (the user workflow must not need it)"
            exit 1
          fi
          if grep -qE '#include[[:space:]]+"?Remote_AC_Controller\.ino\.globals' "$SKETCH_DIR/Remote_AC_Controller.ino"; then
            echo "GLOBALS_MANUALLY_INCLUDED=True (the core includes it automatically)"
            exit 1
          fi
          test -f "$SKETCH_DIR/Remote_AC_Controller.ino.globals.example.h"
          echo 'SKETCH_YAML_EXTRA_FLAGS_PRESENT=False'
          echo 'GLOBALS_MANUALLY_INCLUDED=False'

      - name: Setup Arduino CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin" "$HOME/Arduino"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/bin:$PATH"
          arduino-cli version
          arduino-cli config init
          arduino-cli config set directories.user "$HOME/Arduino"
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2

      - name: Install Library Manager dependencies (documented versions)
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli lib install "DHT sensor library@1.4.7"
          arduino-cli lib install "Adafruit Unified Sensor@1.1.15"
          arduino-cli lib install "PubSubClient@2.8.0"
          arduino-cli lib install "ArduinoJson@6.21.5"

      - name: Install repository libraries with the documented script
        shell: bash
        run: |
          set -euo pipefail
          bash firmware/arduino-ide/tools/install-arduino-libraries.sh
          # The documented script delegates the srun-c flattening to
          # tools/prepare_srun_arduino_library.py, which must have emitted a
          # complete library: licence, third-party notice and SHA256 manifest.
          LIB="$HOME/Arduino/libraries/srun-c"
          for f in library.properties LICENSE THIRD_PARTY_NOTICE MANIFEST.json \
                   src/srun.h src/compat.h src/srun.c src/md.c ; do
            test -f "$LIB/$f" || { echo "SRUN_ARDUINO_LIB_INCOMPLETE: $f"; exit 1; }
          done
          echo "SRUN_ARDUINO_LIB_GENERATED=True"

      - name: Configure globals.h like a first-time user (${{ matrix.name }})
        shell: bash
        run: |
          set -euo pipefail
          SKETCH_DIR=firmware/arduino-ide/Remote_AC_Controller
          G="$SKETCH_DIR/Remote_AC_Controller.ino.globals.h"

          # Documented step 1: copy the example to the real (git-ignored) name.
          cp "$SKETCH_DIR/Remote_AC_Controller.ino.globals.example.h" "$G"

          # Documented step 2: edit the switches. A human edits them in the
          # editor; CI performs the same edits in place so the file stays an
          # ordinary globals header - no command-line flag is ever added.
          for kv in ${{ matrix.switches }} ; do
            k="${kv%%=*}"; v="${kv#*=}"
            sed -i -E "s|^#define[[:space:]]+${k}[[:space:]]+[0-9]+|#define ${k} ${v}|" "$G"
            grep -qE "^#define ${k} ${v}\$" "$G" || { echo "GLOBALS_EDIT_FAIL: $k"; exit 1; }
            echo "globals.h: $k = $v"
          done

          # Documented step 2b: campus builds also select a profile header here.
          if [ -n "${{ matrix.profile }}" ]; then
            sed -i "s|^#endif // REMOTE_AC_CONTROLLER_INO_GLOBALS_H|#define CAMPUS_PROFILE_HEADER \"${{ matrix.profile }}\"\n&|" "$G"
            grep -q 'CAMPUS_PROFILE_HEADER "${{ matrix.profile }}"' "$G" || { echo 'GLOBALS_PROFILE_FAIL'; exit 1; }
            echo 'globals.h: CAMPUS_PROFILE_HEADER = ${{ matrix.profile }}'
          fi

          echo '--- effective globals.h (defines only) ---'
          grep -E '^#define' "$G"

      - name: Compile as an ordinary user (${{ matrix.name }})
        shell: bash
        run: |
          set -euo pipefail
          SKETCH_DIR="$(pwd)/firmware/arduino-ide/Remote_AC_Controller"
          OUT="$SKETCH_DIR/build"
          # No -include. No build.extra_flags. No stub header. No sketch.yaml flags.
          arduino-cli compile \
            --fqbn esp8266:esp8266:nodemcuv2 \
            --output-dir "$OUT" \
            "$SKETCH_DIR"
          ELF=$(find "$OUT" -name "*.elf" 2>/dev/null | head -1)
          BIN=$(find "$OUT" -name "*.bin" 2>/dev/null | head -1)
          if [ -z "$ELF" ]; then echo "ARDUINO_ELF_EXISTS=False"; exit 1; fi
          if [ -z "$BIN" ]; then echo "ARDUINO_BIN_EXISTS=False"; exit 1; fi
          echo "ARDUINO_ELF_EXISTS=True"
          size "$ELF" || true
          echo "ARDUINO_BIN_EXISTS=True ($(wc -c < "$BIN") bytes)"
          echo "ARDUINO_BIN_SHA256=$(sha256sum "$BIN" | cut -d' ' -f1)"
          echo "ARDUINO_USER_WORKFLOW_COMPILE_PASS=True"

      - name: NEGATIVE — campus auth without a profile must fail to compile
        if: matrix.name == 'offline'
        shell: bash
        run: |
          set -euo pipefail
          SKETCH_DIR="$(pwd)/firmware/arduino-ide/Remote_AC_Controller"
          G="$SKETCH_DIR/Remote_AC_Controller.ino.globals.h"
          cp "$SKETCH_DIR/Remote_AC_Controller.ino.globals.example.h" "$G"
          sed -i -E 's|^#define[[:space:]]+ENABLE_WIFI[[:space:]]+[0-9]+|#define ENABLE_WIFI 1|'          "$G"
          sed -i -E 's|^#define[[:space:]]+ENABLE_CAMPUS_AUTH[[:space:]]+[0-9]+|#define ENABLE_CAMPUS_AUTH 1|' "$G"
          # Deliberately do NOT define CAMPUS_PROFILE_HEADER.
          rm -rf "$SKETCH_DIR/build/negative"
          set +e
          LOG=$(arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 \
                  --output-dir "$SKETCH_DIR/build/negative" "$SKETCH_DIR" 2>&1)
          rc=$?
          set -e
          rm -f "$G"
          if [ "$rc" -eq 0 ]; then
            echo 'CAMPUS_WITHOUT_PROFILE_REJECTED=False (build silently picked a portal)'
            exit 1
          fi
          if ! printf '%s' "$LOG" | grep -q 'requires CAMPUS_PROFILE_HEADER'; then
            echo 'CAMPUS_WITHOUT_PROFILE_REJECTED=False (failed for an unrelated reason)'
            printf '%s\n' "$LOG" | tail -40
            exit 1
          fi
          echo 'CAMPUS_WITHOUT_PROFILE_REJECTED=True'

  # ---------------------------------------------------------------------------
  # host-tests — pure-logic unit tests on the host toolchain (no hardware, no CI secrets)
  # ---------------------------------------------------------------------------
  # Validates the two pieces of campus-auth logic that MUST be correct before any
  # device is involved:
  #   - CampusAuthPolicy (rate-limit / backoff ladder / hourly quota / hard-block):
  #     functional runtime tests, header-only and Arduino-free.
  #   - feature_gates.h derived predicates: compile-time invariants under several
  #     legal flag combinations, PLUS NEGATIVE tests asserting that illegal flag
  #     combinations fail to compile (the #error guards in feature_gates.h).
  firmware-host-tests:
    name: firmware-host-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compile & run CampusAuthPolicy tests
        run: |
          set -euo pipefail
          g++ -std=c++11 -Wall -I firmware/shared/RemoteACCore/src \
            test/host/test_campus_auth_policy.cpp -o /tmp/test_policy
          /tmp/test_policy

      - name: Compile & run WifiManager connect-decision tests
        run: |
          set -euo pipefail
          for s in "-DENABLE_WIFI=1" \
                   "-DENABLE_WIFI=1 -DENABLE_WIFI_CREDENTIALS=1" \
                   "-DENABLE_WIFI=1 -DENABLE_WIFI_CREDENTIALS=1 -DENABLE_AUTO_WIFI_CONNECT=1" \
                   "-DENABLE_WIFI=1 -DENABLE_CAMPUS_AUTH=1" \
                   "-DENABLE_WIFI=1 -DENABLE_WIFI_CREDENTIALS=1 -DENABLE_CLOUD=1" \
                   "-DENABLE_WIFI=1 -DENABLE_WIFI_CREDENTIALS=1 -DENABLE_AUTO_WIFI_CONNECT=1 -DENABLE_CLOUD=1 -DENABLE_CLOUD_CREDENTIALS=1"; do
            echo "== wifi connect decision: [$s] =="
            g++ -std=c++11 -Wall -I firmware/shared/RemoteACCore/src $s \
              test/host/test_wifi_connect.cpp -o /tmp/test_wifi
            /tmp/test_wifi
          done

      - name: WifiManager real association integration test (v1.2.4)
        run: |
          set -euo pipefail
          g++ -std=c++11 -Wall -I firmware/shared/RemoteACCore/src \
            test/host/test_wifi_manager_integration.cpp -o /tmp/test_assoc
          /tmp/test_assoc
          g++ -std=c++11 -Wall -I firmware/shared/RemoteACCore/src \
            test/host/test_cloud_secret_validation.cpp -o /tmp/test_cloudval
          /tmp/test_cloudval

      - name: MQTT TLS policy + adapter tests (v1.2.5)
        run: |
          set -euo pipefail
          g++ -std=c++11 -Wall -I firmware/shared/RemoteACCore/src \
            test/host/test_mqtt_tls_policy.cpp -o /tmp/test_tls_policy
          /tmp/test_tls_policy | tee /tmp/tls_policy_out.txt
          grep -q 'MQTT_TLS_POLICY_CASE_FAILURE=0' /tmp/tls_policy_out.txt

      - name: SSID validation + Python/C++ parity tests (v1.2.5)
        run: |
          set -euo pipefail
          python3 tools/gen-wifi-ssid-cases.py --check
          g++ -std=c++11 -Wall -I firmware/shared/RemoteACCore/src \
            test/host/test_wifi_ssid_validation.cpp -o /tmp/test_ssid
          /tmp/test_ssid | tee /tmp/ssid_out.txt
          grep -q 'WIFI_SSID_VALIDATION_CASE_FAILURE=0' /tmp/ssid_out.txt
          python3 tools/test-wifi-ssid-parity.py | tee /tmp/ssid_parity.txt
          grep -q 'WIFI_SSID_PY_CPP_PARITY_FAILURE=0' /tmp/ssid_parity.txt

      - name: Secret content validator self-test (v1.2.5)
        run: |
          set -euo pipefail
          python3 tools/validate-cloud-secrets.py --self-test
          python3 tools/check-cloud-secret-authority.py
          python3 tools/check-cloud-secret-authority.py --self-test

      - name: WIFI_AUTOCONNECT policy matrix (7 profile semantics)
        run: |
          set -euo pipefail
          INC="-I firmware/shared/RemoteACCore/src"
          pass=0; total=0
          run_case() {
            name="$1"; flags="$2"; macro="$3"
            total=$((total+1))
            echo "== policy case: $name =="
            if g++ -std=c++11 -Wall $INC -DV123_CASE_$macro $flags \
                 test/host/test_wifi_policy.cpp -o /tmp/test_policy_case \
              && /tmp/test_policy_case; then
              pass=$((pass+1))
            else
              echo "POLICY_CASE_FAILED: $name"
            fi
          }
          run_case public "-DENABLE_WIFI=1 -DENABLE_CLOUD=1" PUBLIC
          run_case public-cloud-example "-DENABLE_WIFI=1 -DENABLE_CLOUD=1" PUBLIC_CLOUD_EXAMPLE
          run_case local-wifi "-DENABLE_WIFI=1 -DENABLE_WIFI_CREDENTIALS=1 -DENABLE_AUTO_WIFI_CONNECT=1" LOCAL_WIFI
          run_case local-wifi-cloud "-DENABLE_WIFI=1 -DENABLE_WIFI_CREDENTIALS=1 -DENABLE_AUTO_WIFI_CONNECT=1 -DENABLE_CLOUD=1 -DENABLE_CLOUD_CREDENTIALS=1" LOCAL_WIFI_CLOUD
          run_case local-campus-example "-DENABLE_WIFI=1 -DENABLE_CAMPUS_AUTH=1 -DENABLE_AUTO_CAMPUS_AUTH=0 -DCAMPUS_PROFILE_HEADER=\"profiles/xidian.example.h\"" LOCAL_CAMPUS_EXAMPLE
          run_case campus-auto-live "-DENABLE_WIFI=1 -DENABLE_CAMPUS_AUTH=1 -DENABLE_AUTO_CAMPUS_AUTH=1 -DENABLE_CONTROLLED_LIVE_AUTH=1 -DCAMPUS_PROFILE_HEADER=\"profiles/xidian.example.h\"" CAMPUS_AUTO
          run_case wifi-off "" WIFI_OFF
          echo "WIFI_AUTOCONNECT_POLICY_CASE_TOTAL=$total"
          echo "WIFI_AUTOCONNECT_POLICY_CASE_PASS=$pass"
          [ "$total" -eq 7 ] || exit 1
          [ "$pass" -eq 7 ] || exit 1

      - name: Compile feature_gates invariants under legal flag sets
        run: |
          set -euo pipefail
          INC="-I firmware/shared/RemoteACCore/src"
          sets=(
            ""              # all defaults (offline build)
            "-DENABLE_WIFI=1"
            "-DENABLE_WIFI=1 -DENABLE_CAMPUS_AUTH=1"
            "-DENABLE_WIFI=1 -DENABLE_CAMPUS_AUTH=1 -DENABLE_AUTO_CAMPUS_AUTH=0"
            "-DENABLE_WIFI=1 -DENABLE_CLOUD=1"
            "-DENABLE_WIFI=1 -DENABLE_CLOUD=1 -DENABLE_CAMPUS_AUTH=1 -DENABLE_AUTO_CAMPUS_AUTH=0"
            "-DENABLE_WIFI=1 -DENABLE_CLOUD=1 -DENABLE_CLOUD_CREDENTIALS=1"
            "-DENABLE_WIFI=1 -DENABLE_WIFI_CREDENTIALS=1"
            "-DENABLE_WIFI=1 -DENABLE_WIFI_CREDENTIALS=1 -DENABLE_AUTO_WIFI_CONNECT=1"
            "-DENABLE_WIFI=1 -DENABLE_WIFI_CREDENTIALS=1 -DENABLE_AUTO_WIFI_CONNECT=1 -DENABLE_CLOUD=1"
          )
          for s in "${sets[@]}"; do
            echo "== feature_gates: [$s] =="
            g++ -std=c++11 $INC $s test/host/test_feature_gates.cpp -o /tmp/test_gates
            /tmp/test_gates
          done

      - name: NEGATIVE tests — illegal flag combinations must fail to compile
        run: |
          set -euo pipefail
          INC="-I firmware/shared/RemoteACCore/src"
          bad=(
            "-DENABLE_CAMPUS_AUTH=1"                # campus without wifi
            "-DENABLE_AUTO_CAMPUS_AUTH=1"           # auto without campus
            "-DENABLE_CLOUD=1"                     # cloud without wifi
            "-DENABLE_CLOUD_CREDENTIALS=1"          # cloud creds without cloud
            "-DENABLE_CONTROLLED_LIVE_AUTH=1"       # live auth without campus
            "-DENABLE_AUTO_CAMPUS_AUTH=1"           # auto auth without campus/live
            "-DENABLE_WIFI=1 -DENABLE_CAMPUS_AUTH=1 -DENABLE_AUTO_CAMPUS_AUTH=1"  # auto without live auth
            "-DENABLE_IR_LAB_LEARNING_COMMANDS=1"   # lab IR without IR mutating
            "-DENABLE_WIFI_CREDENTIALS=1"           # wifi creds without wifi
            "-DENABLE_AUTO_WIFI_CONNECT=1"          # auto wifi connect without wifi
            "-DENABLE_WIFI=1 -DENABLE_WIFI_CREDENTIALS=1 -DENABLE_CAMPUS_AUTH=1"  # creds + campus conflict
          )
          fail=0
          for s in "${bad[@]}"; do
            echo "== expect COMPILE FAIL: [$s] =="
            if g++ -std=c++11 $INC $s test/host/test_feature_gates.cpp -o /tmp/test_gates_bad 2>/dev/null; then
              echo "UNEXPECTED_PASS: illegal combo compiled: $s"
              fail=1
            else
              echo "OK  rejected as expected: $s"
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      - name: Campus profile contract (public parameters, no credentials)
        run: |
          set -euo pipefail
          INC="-I firmware/shared/RemoteACCore/src"
          BASE="-std=c++11 -Wall $INC -DENABLE_WIFI=1 -DENABLE_CAMPUS_AUTH=1"

          echo '== profiles/xidian.example.h (verified public parameters) =='
          g++ $BASE '-DCAMPUS_PROFILE_HEADER="profiles/xidian.example.h"' \
            -DEXPECT_XIDIAN=1 test/host/test_campus_profiles.cpp -o /tmp/test_profile_xidian
          /tmp/test_profile_xidian

          echo '== profiles/generic_srun.example.h (portable template) =='
          g++ $BASE '-DCAMPUS_PROFILE_HEADER="profiles/generic_srun.example.h"' \
            test/host/test_campus_profiles.cpp -o /tmp/test_profile_generic
          /tmp/test_profile_generic

      - name: NEGATIVE — campus auth without a profile must fail to compile
        run: |
          set -euo pipefail
          INC="-I firmware/shared/RemoteACCore/src"
          printf '#include "config/campus_config.h"\nint main() { return 0; }\n' \
            > /tmp/campus_no_profile.cpp
          set +e
          g++ -std=c++11 $INC -DENABLE_WIFI=1 -DENABLE_CAMPUS_AUTH=1 \
            /tmp/campus_no_profile.cpp -o /tmp/campus_no_profile 2>/tmp/campus_err.txt
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'CAMPUS_WITHOUT_PROFILE_REJECTED=False (the build silently picked a portal)'
            exit 1
          fi
          if ! grep -q 'requires CAMPUS_PROFILE_HEADER' /tmp/campus_err.txt; then
            echo 'CAMPUS_WITHOUT_PROFILE_REJECTED=False (failed for an unrelated reason)'
            cat /tmp/campus_err.txt
            exit 1
          fi
          echo 'CAMPUS_WITHOUT_PROFILE_REJECTED=True'

          # Positive control: the exact same TU compiles once a profile is chosen.
          g++ -std=c++11 $INC -DENABLE_WIFI=1 -DENABLE_CAMPUS_AUTH=1 \
            '-DCAMPUS_PROFILE_HEADER="profiles/xidian.example.h"' \
            /tmp/campus_no_profile.cpp -o /tmp/campus_with_profile
          echo 'CAMPUS_WITH_PROFILE_COMPILES=True'

          # Path (B): all four macros supplied externally is also accepted.
          g++ -std=c++11 $INC -DENABLE_WIFI=1 -DENABLE_CAMPUS_AUTH=1 \
            '-DCAMPUS_SSID="external-ssid"' '-DCAMPUS_PORTAL_HOST="portal.example.edu"' \
            -DCAMPUS_AC_ID=1 '-DCAMPUS_DOMAIN=""' \
            /tmp/campus_no_profile.cpp -o /tmp/campus_external
          echo 'CAMPUS_EXTERNAL_CONFIG_COMPILES=True'

