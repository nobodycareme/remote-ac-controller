name: CI

# Monorepo CI for remote-ac-controller.
#
# Scope and safety rules (enforced by review, not by CI itself):
#   - This workflow NEVER touches production, never deploys, never flashes hardware.
#   - This workflow NEVER consumes repository/organization secrets.
#   - Only the public build profile is exercised for firmware.
#   - Real-IR transmission, private profiles and production credentials are out of scope.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only. No packages, no id-token, no write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # firmware-ci
  # ---------------------------------------------------------------------------
  # The firmware toolchain (PlatformIO Core + xtensa) is provisioned locally
  # under Environment/PlatformIO and is intentionally NOT vendored into this
  # public repository. A hosted runner therefore cannot produce a byte-identical
  # firmware image. This job performs the checks that ARE reproducible in CI:
  #   1. static repository hygiene (no secrets header committed)
  #   2. firmware source/structure sanity
  #   3. dev.ps1 contract check (the only supported entry point)
  # Full compilation is performed locally via: tools/build-all.ps1
  firmware-ci:
    name: firmware-ci
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify firmware layout
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $required = @(
            'firmware/agent-platformio/platformio.ini',
            'firmware/agent-platformio/src/main.cpp',
            'firmware/agent-platformio/include/cloud_secrets.example.h',
            'firmware/agent-platformio/tools/dev.ps1',
            'firmware/shared/RemoteACCore/library.properties',
            'firmware/shared/RemoteACCore/src/RemoteACApp.h',
            'firmware/arduino-ide/Remote_AC_Controller/Remote_AC_Controller.ino'
          )
          foreach ($p in $required) {
            if (-not (Test-Path -LiteralPath $p)) {
              Write-Error "FIRMWARE_LAYOUT_FAIL: missing $p"
            }
            Write-Output "OK  $p"
          }

      - name: Assert no firmware secrets are committed
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $forbidden = @(
            'firmware/agent-platformio/include/secrets.h',
            'firmware/agent-platformio/include/cloud_secrets.h'
          )
          $bad = @()
          foreach ($p in $forbidden) {
            if (Test-Path -LiteralPath $p) { $bad += $p }
          }
          if ($bad.Count -gt 0) {
            Write-Error "SECRETS_COMMITTED: $($bad -join ', ')"
          }
          Write-Output 'OK  no secrets header committed'

      - name: Verify dev.ps1 exposes the documented contract
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $src = Get-Content -LiteralPath 'firmware/agent-platformio/tools/dev.ps1' -Raw
          foreach ($cmd in @('build', 'verify', 'test', 'status')) {
            if ($src -notmatch [regex]::Escape("'$cmd'")) {
              Write-Error "DEVPS1_CONTRACT_FAIL: command '$cmd' not found in ValidateSet"
            }
            Write-Output "OK  dev.ps1 command '$cmd'"
          }
          if ($src -notmatch [regex]::Escape("'public'")) {
            Write-Error "DEVPS1_CONTRACT_FAIL: profile 'public' not found"
          }
          Write-Output "OK  dev.ps1 profile 'public'"

      - name: Setup Python for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          pio --version

      - name: dev.ps1 verify (public profile)
        run: pwsh firmware/agent-platformio/tools/dev.ps1 verify -Profile public

      - name: dev.ps1 test (public profile)
        run: pwsh firmware/agent-platformio/tools/dev.ps1 test -Profile public

      - name: dev.ps1 build (public profile, artifact secret-scanned)
        run: pwsh firmware/agent-platformio/tools/dev.ps1 build -Profile public

  # ---------------------------------------------------------------------------
  # arduino-ide-ci
  # ---------------------------------------------------------------------------
  # Compiles the Arduino IDE sketch with the public (non-production) build
  # configuration. ENABLE_CLOUD=0 and ENABLE_CAMPUS_AUTH=0 — no real credentials,
  # no real IR, no private data required.
  arduino-ide-ci:
    name: arduino-ide-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Arduino CLI
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli version
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2

      - name: Install dependencies
        run: |
          set -euo pipefail
          arduino-cli lib install "DHT sensor library@1.4.7"
          arduino-cli lib install "Adafruit Unified Sensor@1.1.15"
          arduino-cli lib install "PubSubClient@2.8.0"
          arduino-cli lib install "ArduinoJson@6.21.5"

      - name: Compile Arduino IDE public sketch
        run: |
          set -euo pipefail
          echo "=== Creating CI build configuration ==="

          # Copy config template
          cp firmware/arduino-ide/Remote_AC_Controller/config.example.h \
             firmware/arduino-ide/Remote_AC_Controller/config.h

          # Install shared library
          mkdir -p "$HOME/Arduino/libraries"
          ln -sf "$(pwd)/firmware/shared/RemoteACCore" "$HOME/Arduino/libraries/RemoteACCore"

          # Comprehensive CI stubs: resolve all PlatformIO-specific dependencies
          # that the shared library references but aren't needed for public build
          cat > /tmp/ci_stubs.h << 'ENDSTUBS'
          #pragma once
          #define ENABLE_CLOUD 0
          #define ENABLE_CAMPUS_AUTH 0
          #define ENABLE_IR_MUTATING_COMMANDS 0
          #define ENABLE_CLOUD_CREDENTIALS 0
          #define CLOUD_CREDENTIALS_AVAILABLE 0
          #define MQTT_BROKER_HOST "localhost"
          #define MQTT_BROKER_PORT 1883
          #define MQTT_DEVICE_ID "ci"
          #define MQTT_USERNAME "ci"
          #define MQTT_PASSWORD "ci"
          #define MQTT_CA_CERT ""
          #define MQTT_TLS_FINGERPRINT ""
          #define CAMPUS_SSID ""
          #define CAMPUS_HOST ""
          #define CAMPUS_AC_ID 0
          #define CAMPUS_DOMAIN ""
          // Stub campus auth types and srun-c API
          namespace CampusCredentials { inline bool ready() { return false; } }
          enum CampusAuthResult { CAMPUS_AUTH_SUCCESS=0, CAMPUS_AUTH_TIMEOUT=1, CAMPUS_AUTH_TLS_PIN_MISMATCH=2, CAMPUS_AUTH_UNKNOWN_RESPONSE=3 };
          struct CampusAuthResults { const char* error; };
          class CampusAuthVendor {
          public:
            bool tlsPinValid() { return true; }
            CampusAuthResult login(const char*) { return CAMPUS_AUTH_SUCCESS; }
            CampusAuthResult logout() { return CAMPUS_AUTH_SUCCESS; }
            const char* lastErrMsg() { return ""; }
            const char* lastSucMsg() { return ""; }
            static const char* resultStr(CampusAuthResult) { return "OK"; }
          };
          // Minimal srun.h stubs
          extern "C" {
            inline int srun_login(const char*,const char*,const char*,char*,size_t) { return 0; }
            inline int srun_logout(const char*,const char*,char*,size_t) { return 0; }
          }
          // Cloud credentials stubs
          namespace CloudCredentials {
            inline bool available() { return false; }
            inline const char* host() { return "localhost"; }
            inline uint16_t port() { return 1883; }
            inline const char* username() { return ""; }
            inline const char* password() { return ""; }
            inline const char* deviceId() { return ""; }
            inline const char* tlsFingerprint() { return ""; }
          }
          ENDSTUBS

          SRUN_INC="firmware/agent-platformio/lib/srun-c/include"
          echo "=== Compiling ==="
          arduino-cli compile \
            --fqbn esp8266:esp8266:nodemcuv2 \
            --build-property "build.extra_flags=-include /tmp/ci_stubs.h -I${SRUN_INC}" \
            firmware/arduino-ide/Remote_AC_Controller

          echo "=== Output ==="
          SKETCH_DIR="firmware/arduino-ide/Remote_AC_Controller"
          ELF=$(find "$SKETCH_DIR/build" -name "*.elf" 2>/dev/null | head -1)
          BIN=$(find "$SKETCH_DIR/build" -name "*.bin" 2>/dev/null | head -1)
          [ -n "$ELF" ] && { echo "ARDUINO_ELF_EXISTS=True"; size "$ELF" || true; }
          [ -n "$BIN" ] && echo "ARDUINO_BIN_EXISTS=True ($(wc -c < "$BIN") bytes)"
          echo "ARDUINO_CLI_COMPILE_PASS=True"

  # ---------------------------------------------------------------------------
  # cloud-ci
  # ---------------------------------------------------------------------------
  cloud-ci:
    name: cloud-ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: cloud/${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloud/${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # ---------------------------------------------------------------------------
  # repo-hygiene
  # ---------------------------------------------------------------------------
  # Fast, dependency-free guard against the classes of files that must never be
  # published from this project.
  repo-hygiene:
    name: repo-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert excluded directories are absent
        run: |
          set -euo pipefail
          fail=0
          for d in Private Evidence _QUARANTINE_ ; do
            if [ -e "$d" ]; then
              echo "EXCLUDED_DIR_PRESENT: $d"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "OK  no excluded directories"

      - name: Assert no key / certificate / database artefacts are tracked
        run: |
          set -euo pipefail
          pattern='\.(pem|key|p12|pfx|db|sqlite|sqlite3|bundle)$'
          if git ls-files | grep -Ei "$pattern" ; then
            echo "FORBIDDEN_ARTEFACT_TRACKED"
            exit 1
          fi
          echo "OK  no key/cert/database artefacts tracked"

      - name: Assert LICENSE and NOTICE are present
        run: |
          set -euo pipefail
          test -f LICENSE || { echo "LICENSE_MISSING"; exit 1; }
          test -f NOTICE  || { echo "NOTICE_MISSING"; exit 1; }
          grep -q 'Apache License' LICENSE || { echo "LICENSE_NOT_APACHE"; exit 1; }
          echo "OK  Apache-2.0 LICENSE and NOTICE present"
