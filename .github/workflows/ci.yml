  # ---------------------------------------------------------------------------
  # repo-hygiene
  # ---------------------------------------------------------------------------
  # Fast, dependency-free guard against the classes of files that must never be
  # published from this project.
  repo-hygiene:
    name: repo-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert excluded directories are absent
        run: |
          set -euo pipefail
          fail=0
          for d in Private Evidence _QUARANTINE_ ; do
            if [ -e "$d" ]; then
              echo "EXCLUDED_DIR_PRESENT: $d"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "OK  no excluded directories"

      - name: Assert no key / certificate / database artefacts are tracked
        run: |
          set -euo pipefail
          pattern='\.(pem|key|p12|pfx|db|sqlite|sqlite3|bundle)$'
          if git ls-files | grep -Ei "$pattern" ; then
            echo "FORBIDDEN_ARTEFACT_TRACKED"
            exit 1
          fi
          echo "OK  no key/cert/database artefacts tracked"

      - name: Assert LICENSE and NOTICE are present
        run: |
          set -euo pipefail
          test -f LICENSE || { echo "LICENSE_MISSING"; exit 1; }
          test -f NOTICE  || { echo "NOTICE_MISSING"; exit 1; }
          grep -q 'Apache License' LICENSE || { echo "LICENSE_NOT_APACHE"; exit 1; }
          echo "OK  Apache-2.0 LICENSE and NOTICE present"

      - name: Assert srun-c has exactly one authoritative source tree
        run: |
          set -euo pipefail
          # Every tracked srun-c translation unit must live under the single
          # canonical directory. A second tracked copy (e.g. a flattened Arduino
          # duplicate) would create two divergent authorities for one protocol.
          CANON='firmware/agent-platformio/lib/srun-c'
          stray=$(git ls-files -- '*srun*' \
                  | grep -E '\.(c|h|cpp)$' \
                  | grep -v "^${CANON}/" \
                  | grep -v '\.example\.h$' || true)
          if [ -n "$stray" ]; then
            echo "SRUN_DUPLICATE_TRACKED_SOURCE:"
            printf '%s\n' "$stray"
            exit 1
          fi
          count=$(git ls-files -- "${CANON}" | grep -cE '\.(c|h|cpp)$')
          echo "SRUN_CANONICAL_SOURCE_PATH=${CANON}"
          echo "SRUN_CANONICAL_TRANSLATION_UNITS=${count}"
          echo "SRUN_DUPLICATE_TRACKED_SOURCE_COUNT=0"
          echo "SRUN_SINGLE_SOURCE_PASS=True"
          test -f "${CANON}/LICENSE" || { echo "SRUN_LICENSE_MISSING"; exit 1; }
          echo "SRUN_LICENSE_PRESERVED=True"

      - name: srun-c Arduino adapter is deterministic and fails closed
        run: |
          set -euo pipefail
          OUT=$(mktemp -d)
          python3 tools/prepare_srun_arduino_library.py --output "$OUT" --verify-deterministic

          # The generated library must never be written into the working tree.
          python3 tools/prepare_srun_arduino_library.py --output . 2>/dev/null \
            && { echo 'ADAPTER_WROTE_INTO_REPO=True'; exit 1; } \
            || echo 'ADAPTER_REFUSES_TO_WRITE_INTO_REPO=True'

          # Fail-closed: an unreviewed source file must abort the generation.
          echo '/* stray */' > firmware/agent-platformio/lib/srun-c/src/unreviewed.c
          set +e
          python3 tools/prepare_srun_arduino_library.py --output "$OUT" 2>/dev/null
          rc=$?
          set -e
          rm -f firmware/agent-platformio/lib/srun-c/src/unreviewed.c
          [ "$rc" -ne 0 ] || { echo 'ADAPTER_ACCEPTED_UNKNOWN_SOURCE=True'; exit 1; }
          echo 'ADAPTER_REJECTS_UNKNOWN_SOURCE=True'
          git diff --quiet -- firmware/agent-platformio/lib/srun-c
          echo 'SRUN_ADAPTER_DETERMINISTIC_PASS=True'

      - name: PCB Rev 1.0.1 release contract
        run: |
          set -euo pipefail
          python3 tools/check-pcb-release.py
          python3 tools/check-pcb-release.py --negative-test
          python3 tools/check-pcb-release.py --determinism-test

