name: CI

# Monorepo CI for remote-ac-controller.
#
# Scope and safety rules (enforced by review, not by CI itself):
#   - This workflow NEVER touches production, never deploys, never flashes hardware.
#   - This workflow NEVER consumes repository/organization secrets.
#   - Only the public build profile is exercised for firmware.
#   - Real-IR transmission, private profiles and production credentials are out of scope.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: read-only. No packages, no id-token, no write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # firmware-ci
  # ---------------------------------------------------------------------------
  # The firmware toolchain (PlatformIO Core + xtensa) is provisioned locally
  # under Environment/PlatformIO and is intentionally NOT vendored into this
  # public repository. A hosted runner therefore cannot produce a byte-identical
  # firmware image. This job performs the checks that ARE reproducible in CI:
  #   1. static repository hygiene (no secrets header committed)
  #   2. firmware source/structure sanity
  #   3. dev.ps1 contract check (the only supported entry point)
  # Full compilation is performed locally via: tools/build-all.ps1
  firmware-ci:
    name: firmware-ci
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify firmware layout
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $required = @(
            'firmware/agent-platformio/platformio.ini',
            'firmware/agent-platformio/src/main.cpp',
            'firmware/agent-platformio/include/cloud_secrets.example.h',
            'firmware/agent-platformio/tools/dev.ps1',
            'firmware/shared/RemoteACCore/library.properties',
            'firmware/shared/RemoteACCore/src/RemoteACApp.h',
            'firmware/arduino-ide/Remote_AC_Controller/Remote_AC_Controller.ino'
          )
          foreach ($p in $required) {
            if (-not (Test-Path -LiteralPath $p)) {
              Write-Error "FIRMWARE_LAYOUT_FAIL: missing $p"
            }
            Write-Output "OK  $p"
          }

      - name: Assert no firmware secrets are committed
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $forbidden = @(
            'firmware/agent-platformio/include/secrets.h',
            'firmware/agent-platformio/include/cloud_secrets.h'
          )
          $bad = @()
          foreach ($p in $forbidden) {
            if (Test-Path -LiteralPath $p) { $bad += $p }
          }
          if ($bad.Count -gt 0) {
            Write-Error "SECRETS_COMMITTED: $($bad -join ', ')"
          }
          Write-Output 'OK  no secrets header committed'

      - name: Verify dev.ps1 exposes the documented contract
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $src = Get-Content -LiteralPath 'firmware/agent-platformio/tools/dev.ps1' -Raw
          foreach ($cmd in @('build', 'verify', 'test', 'status')) {
            if ($src -notmatch [regex]::Escape("'$cmd'")) {
              Write-Error "DEVPS1_CONTRACT_FAIL: command '$cmd' not found in ValidateSet"
            }
            Write-Output "OK  dev.ps1 command '$cmd'"
          }
          if ($src -notmatch [regex]::Escape("'public'")) {
            Write-Error "DEVPS1_CONTRACT_FAIL: profile 'public' not found"
          }
          Write-Output "OK  dev.ps1 profile 'public'"

      - name: Setup Python for PlatformIO
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install platformio
          pio --version

      - name: dev.ps1 verify (public profile)
        run: pwsh firmware/agent-platformio/tools/dev.ps1 verify -Profile public

      - name: dev.ps1 test (public profile)
        run: pwsh firmware/agent-platformio/tools/dev.ps1 test -Profile public

      - name: dev.ps1 build (public profile, artifact secret-scanned)
        run: pwsh firmware/agent-platformio/tools/dev.ps1 build -Profile public

  # ---------------------------------------------------------------------------
  # arduino-ide-ci
  # ---------------------------------------------------------------------------
  # Verifies the Arduino IDE project structure.
  # Full compilation requires local provisioning (cloud_secrets.h, private IR
  # codes, etc.) and is not reproducible in a public CI environment without
  # those artifacts. The shared business logic is structurally verified in
  # firmware-ci (PlatformIO build). Both modes share the same source at
  # firmware/shared/RemoteACCore/.
  arduino-ide-ci:
    name: arduino-ide-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Arduino CLI
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=/usr/local/bin sh
          arduino-cli version
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2

      - name: Install dependencies
        run: |
          set -euo pipefail
          arduino-cli lib install "DHT sensor library@1.4.7"
          arduino-cli lib install "Adafruit Unified Sensor@1.1.15"
          arduino-cli lib install "PubSubClient@2.8.0"
          arduino-cli lib install "ArduinoJson@6.21.5"

      - name: Verify Arduino project structure
        run: |
          set -euo pipefail
          fail=0
          # Sketch directory and .ino file
          SKETCH_DIR="firmware/arduino-ide/Remote_AC_Controller"
          SKETCH_INO="$SKETCH_DIR/Remote_AC_Controller.ino"
          test -d "$SKETCH_DIR" || { echo "FAIL: sketch directory missing"; fail=1; }
          test -f "$SKETCH_INO" || { echo "FAIL: .ino file missing"; fail=1; }
          echo "OK: sketch directory and .ino present"
          # sketch.yaml
          test -f "$SKETCH_DIR/sketch.yaml" || { echo "FAIL: sketch.yaml missing"; fail=1; }
          echo "OK: sketch.yaml present"
          # Config template
          test -f "$SKETCH_DIR/config.example.h" || { echo "FAIL: config.example.h missing"; fail=1; }
          echo "OK: config.example.h present"
          # Shared library
          LIB="firmware/shared/RemoteACCore"
          test -f "$LIB/library.properties" || { echo "FAIL: library.properties missing"; fail=1; }
          test -f "$LIB/src/RemoteACApp.h" || { echo "FAIL: RemoteACApp.h missing"; fail=1; }
          test -f "$LIB/src/RemoteACApp.cpp" || { echo "FAIL: RemoteACApp.cpp missing"; fail=1; }
          echo "OK: shared library present"
          # Core available
          arduino-cli core list | grep -q esp8266 || { echo "FAIL: esp8266 core not installed"; fail=1; }
          echo "OK: esp8266 core installed"
          # Dependencies available
          for lib in "DHT sensor library" "Adafruit Unified Sensor" "PubSubClient" "ArduinoJson"; do
            arduino-cli lib list | grep -q "$lib" || { echo "WARN: $lib not found in list"; }
          done
          echo "OK: dependencies installed"
          [ "$fail" -eq 0 ] || exit 1
          echo "ARDUINO_STRUCTURE_VERIFIED=True"

  # ---------------------------------------------------------------------------
  # cloud-ci
  # ---------------------------------------------------------------------------
  cloud-ci:
    name: cloud-ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: cloud/${{ matrix.package }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloud/${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # ---------------------------------------------------------------------------
  # repo-hygiene
  # ---------------------------------------------------------------------------
  # Fast, dependency-free guard against the classes of files that must never be
  # published from this project.
  repo-hygiene:
    name: repo-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert excluded directories are absent
        run: |
          set -euo pipefail
          fail=0
          for d in Private Evidence _QUARANTINE_ ; do
            if [ -e "$d" ]; then
              echo "EXCLUDED_DIR_PRESENT: $d"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "OK  no excluded directories"

      - name: Assert no key / certificate / database artefacts are tracked
        run: |
          set -euo pipefail
          pattern='\.(pem|key|p12|pfx|db|sqlite|sqlite3|bundle)$'
          if git ls-files | grep -Ei "$pattern" ; then
            echo "FORBIDDEN_ARTEFACT_TRACKED"
            exit 1
          fi
          echo "OK  no key/cert/database artefacts tracked"

      - name: Assert LICENSE and NOTICE are present
        run: |
          set -euo pipefail
          test -f LICENSE || { echo "LICENSE_MISSING"; exit 1; }
          test -f NOTICE  || { echo "NOTICE_MISSING"; exit 1; }
          grep -q 'Apache License' LICENSE || { echo "LICENSE_NOT_APACHE"; exit 1; }
          echo "OK  Apache-2.0 LICENSE and NOTICE present"
