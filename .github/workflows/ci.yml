  # ---------------------------------------------------------------------------
  # secret-scan — pattern scan across the whole tracked tree
  # ---------------------------------------------------------------------------
  # Complements repo-hygiene (which checks file classes) by scanning file
  # CONTENT for credential-shaped material. Placeholder values used by the
  # *.example.h templates are explicitly allowed.
  repository-secret-scan:
    name: repository-secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan tracked content for credential-shaped material
        run: |
          set -euo pipefail
          fail=0

          # Documentation and templates legitimately show the SHAPE of a
          # credential using obvious placeholders. Only a value that is neither
          # empty nor an obvious placeholder counts as a real secret.
          PLACEHOLDER='"(|<[^"]*>|\$\{[^"]*\}|(your|YOUR|my|MY)[_A-Za-z0-9]*|(你的|我的)[^"]{0,20}|[Cc]hange[Mm]e|CHANGEME|[Pp]laceholder|PLACEHOLDER|[Ee]xample[_A-Za-z0-9]*|EXAMPLE[_A-Za-z0-9]*|x{3,}|X{3,}|\.{3}|TODO|REPLACE[_A-Za-z0-9]*|20[0-9]{8,}|student_id|password|username)"'

          scan() {
            local label="$1" pattern="$2" allow="${3:-}"
            local hits
            hits=$(git grep -nIE "$pattern" -- . \
                   ':(exclude)tools/check-doc-*.mjs' \
                   ':(exclude)*.example.h' \
                   ':(exclude).github/workflows/ci.yml' || true)
            if [ -n "$hits" ] && [ -n "$allow" ]; then
              hits=$(printf '%s\n' "$hits" | grep -vE "$allow" || true)
            fi
            if [ -n "$hits" ]; then
              echo "SECRET_SCAN_HIT [$label]:"
              printf '%s\n' "$hits" | head -20
              fail=1
            else
              echo "OK  no hits: $label"
            fi
          }

          scan 'private key block'    'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY'
          scan 'authorization header' 'Authorization:[[:space:]]*(Bearer|Basic)[[:space:]]+[A-Za-z0-9._-]{16,}'
          # *.example.h templates are excluded above; any remaining
          # CAMPUS_PASSWORD / CAMPUS_USERNAME definition must resolve to an
          # empty string or an obvious placeholder, never a real account.
          scan 'hardcoded campus credential' \
               '#define[[:space:]]+CAMPUS_(PASSWORD|USERNAME)[[:space:]]+"' \
               "$PLACEHOLDER"
          scan 'campus credential assignment' \
               '(CAMPUS_(PASSWORD|USERNAME)|campus_(password|username))[[:space:]]*[:=][[:space:]]*"' \
               "$PLACEHOLDER"
          scan 'mqtt production url'  'mqtts?://[A-Za-z0-9.-]*\.zmytxylove\.cn'
          scan 'windows user path'    '[A-Za-z]:\\\\Users\\\\[A-Za-z0-9_.-]+'
          [ "$fail" -eq 0 ] || exit 1
          echo 'MONOREPO_SECRET_SCAN_PASS=True'
          echo 'CANONICAL_CURRENT_TREE_SECRET_HITS=0'
          echo 'CANONICAL_PRIVATE_KEY_HITS=0'

  real-ir-exclusion:
    name: real-ir-exclusion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Assert no real IR frame data is published
        run: |
          set -euo pipefail
          # Learned IR frames are long uint16 raw-timing arrays. The public repo
          # ships the learning TOOL, never a captured frame from a real remote.
          hits=$(git grep -nIE 'rawData\[[0-9]{3,}\]|uint16_t[[:space:]]+ir_(frame|raw)_[a-z0-9_]+\[' -- . || true)
          if [ -n "$hits" ]; then
            echo 'REAL_IR_EXCLUSION_PASS=False'
            printf '%s\n' "$hits" | head -20
            exit 1
          fi
          echo 'REAL_IR_EXCLUSION_PASS=True'
          echo 'CANONICAL_REAL_IR_HITS=0'


  # ---------------------------------------------------------------------------
  # ir-simple-learner-windows
  # ---------------------------------------------------------------------------
  # Official IR-learner Windows release-build gate:
  #   1. Python 3.12 x64 with Tk
  #   2. locked (hash-verified) dependency install
  #   3. both IR unit test trees + 20 stability rounds
  #   4. source parity between the two tool copies
  #   5. official build.ps1 -Clean (never manual PyInstaller)
  #   6. EXE --self-test
  #   7. credential / real-IR / private-path scan of the EXE
  #   8. upload the EXE as a CI artifact for review
  ir-simple-learner-windows:
    name: ir-simple-learner-windows
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Verify Python version, arch and Tk
        run: |
          python --version
          python -c "import platform; assert platform.architecture()[0] == '64bit'; print('PYTHON_ARCH=x64')"
          python -c "import tkinter; print('TKINTER_OK', tkinter.TkVersion)"
          python -c "import sys; assert sys.version_info[:2] == (3, 12); print('PYTHON_312_OK')"

      - name: Install locked dependencies (hash-verified)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r tools/ir-simple-learner/requirements-lock.txt

      - name: Run both IR unit test trees
        run: |
          python -m unittest discover -s tools/ir-simple-learner/src/tests -p "test_*.py" -v
          python -m unittest discover -s firmware/agent-platformio/tools/ir_simple_learner/tests -p "test_*.py" -v

      - name: IR source parity check
        run: |
          python tools/check-ir-tool-parity.py

      - name: Stability - 20 consecutive rounds
        run: |
          $pass = 0
          for ($i = 1; $i -le 20; $i++) {
            $out = python -m unittest discover -s tools/ir-simple-learner/src/tests -p "test_*.py" 2>&1 | Select-Object -Last 1
            if ($out -match '^OK') { $pass++ } else { Write-Host "RUN $i FAILED: $out"; exit 1 }
          }
          Write-Host "IR_STABILITY_RUN_TOTAL=20"
          Write-Host "IR_STABILITY_RUN_PASS=$pass"

      - name: Official build.ps1 -Clean (Python 3.12)
        run: |
          ./tools/ir-simple-learner/build.ps1 -Clean -PythonPath (Get-Command python).Source

      - name: EXE self-test (re-run on the built artifact)
        run: |
          $exe = "tools/ir-simple-learner/dist/IR_Simple_Learner_v4_windows_x64.exe"
          if (-not (Test-Path $exe)) { throw "EXE missing: $exe" }
          $proc = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList '--self-test' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "EXE self-test failed: $($proc.ExitCode)" }
          Write-Host "IR_EXE_SELF_TEST_PASS=True"

      - name: EXE SHA-256 and security scan
        run: |
          $exe = "tools/ir-simple-learner/dist/IR_Simple_Learner_v4_windows_x64.exe"
          $h = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          Write-Host "IR_EXE_SHA256=$h"
          $data = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          $text = [System.Text.Encoding]::ASCII.GetString($data)
          $hits = 0
          if ($text -match 'BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY') { $hits++ }
          if ($text -match 'gh[pousr]_[A-Za-z0-9]{20,}') { $hits++ }
          if ($text -match 'Private[\\/](Evidence|Archives|Deliverables)') { $hits++ }
          if ($text -match 'rawData\\[\\d{3,}\\]') { $hits++ }
          if ($hits -ne 0) { throw "EXE security scan found $hits hits" }
          Write-Host "IR_EXE_SECURITY_SCAN_PASS=True"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: IR_Simple_Learner_v4_windows_x64
          path: tools/ir-simple-learner/dist/IR_Simple_Learner_v4_windows_x64.exe
          if-no-files-found: error
