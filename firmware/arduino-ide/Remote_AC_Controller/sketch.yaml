# Arduino CLI / IDE 2.x project configuration
# https://arduino.github.io/arduino-cli/latest/sketch-project-file/

profiles:
  default:
    fqbn: esp8266:esp8266:nodemcuv2
    # Optional: specify port for direct upload
    # port: COM3
    # Optional: custom programmer
    # programmer: esptool

# Dependencies are installed via Arduino Library Manager.
# See README.md for the full dependency list.

# Shared library: firmware/shared/RemoteACCore/
# Install it by symlinking or copying to the Arduino libraries folder.

# Global feature switches (ENABLE_*) are force-included for every translation
# unit via the ESP8266 core `-include` mechanism. The committed .example.h has
# safe public defaults so a fresh clone always compiles; for customization copy
# it to Remote_AC_Controller.ino.globals.h and point this flag at your copy.
compile:
  extra_flags:
    - -include "Remote_AC_Controller.ino.globals.example.h"
