; Remote AC Controller — v0.4.0-cloud-foundation
; Single env: nodemcuv2 (NodeMCU ESP8266 ESP-12E)
; Canonical root: C:\example\remote-ac
; PIO Core: <root>\Environment\PlatformIO\Core
; Build root: <root>\Environment\PlatformIO\Build (controlled by dev.ps1)
; Dev entry: tools\dev.ps1

[platformio]
; Build directory is controlled by dev.ps1 via PLATFORMIO_BUILD_DIR env var.
; Fallback: project-local .pio/ when running pio directly (discouraged).
build_dir = ${sysenv.PLATFORMIO_BUILD_DIR}

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Cloud module (src/cloud/) is compiled whenever ENABLE_CLOUD=1 (dev.ps1 sets it for both profiles).
; Public build has no cloud_secrets.h -> MQTT connect fails safely at runtime (no real connection).
; NOTE: build_src_filter must NOT exclude src/cloud/ (spec forbids excluding cloud from Public build).

; Build flags: set by dev.ps1 via BUILD_FLAGS_PUBLIC / BUILD_FLAGS_PRIVATE env vars.
; Default (public, safe): live auth disabled, IR mutating disabled.
build_flags =
    -DENABLE_WIFI
    -Iinclude
    -Wl,-Map,firmware.map
    ${sysenv.BUILD_FLAGS_PUBLIC}
    ${sysenv.BUILD_FLAGS_PRIVATE}

monitor_filters = time, colorize
