name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public profile builds (requires PlatformIO)
        run: |
          Write-Output "CI: PlatformIO build requires local PIO Core at Environment/PlatformIO/Core"
          Write-Output "See docs/06_环境与构建/环境与构建说明.md for setup instructions"
          Write-Output "This CI check is informational only."