; Remote AC Controller — ESP8266 firmware (PlatformIO build)
;
; Dual-mode architecture:
;   agent-platformio/  — thin main.cpp + private_ir_codes + cloud_secrets
;   shared/RemoteACCore/ — all business logic (compiled as a local library)
;
; Do not invoke `pio` directly. The single development entry point is
; `tools/dev.ps1`, which owns PLATFORMIO_BUILD_DIR, the public build flags and
; the credential-leak safety gates.
;
; Build output goes to firmware/.build/<profile>/ (git-ignored).

[platformio]
; Build directory is controlled by dev.ps1 via PLATFORMIO_BUILD_DIR env var.
; Fallback: project-local .pio/ when running pio directly (discouraged).
build_dir = ${sysenv.PLATFORMIO_BUILD_DIR}

; Source directory: thin main.cpp + private_ir_codes (PlatformIO-only).
; Only honoured here: PlatformIO ignores src_dir inside an [env:*] section and
; prints "Ignore unknown configuration option `src_dir`" on every build.
src_dir = src

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Local library: shared business logic
lib_extra_dirs = ../shared

; `deep` LDF mode is required so transitive library dependencies that live in the
; local lib/ folder (e.g. DHT sensor library -> Adafruit Unified Sensor, and the
; srun-c campus adapter) are resolved consistently for BOTH `pio run` and
; `pio test`. The default `chain` mode resolves them for a normal build but not
; reliably for the test environment, which produces "No such file" errors for
; headers like Adafruit_Sensor.h / WiFiClientSecure.h during `pio test`.
lib_ldf_mode = deep

; Build flags: set by dev.ps1 via BUILD_FLAGS_PUBLIC / BUILD_FLAGS_PRIVATE env vars.
; Default (public, safe): live auth disabled, IR mutating disabled.
; -Iinclude : agent-platformio local include (cloud_secrets.example.h etc.)
; -Isrc     : agent-platformio src/ (private_ir_codes accessible by shared core)
build_flags =
    -DENABLE_WIFI
    -Iinclude
    -Isrc
    -Wl,-Map,firmware.map
    ${sysenv.BUILD_FLAGS_PUBLIC}
    ${sysenv.BUILD_FLAGS_PRIVATE}

monitor_filters = time, colorize
