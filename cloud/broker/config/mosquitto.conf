# ============================================================
# remote-ac-cloud Mosquitto 2.x configuration
# Two listeners:
#   1883 — internal Docker network ONLY (compose does NOT publish this port)
#   8883 — public MQTT over TLS (published to host, requires cert auth)
# ============================================================

persistence true
persistence_location /mosquitto/data/

# Security: no anonymous clients anywhere
allow_anonymous false
password_file /mosquitto/run/passwordfile
acl_file /mosquitto/acl/aclfile

log_dest stdout
log_type all
connection_messages true

# --- Internal listener: Docker compose network only (backend connects here) ---
# Not published to the host in docker-compose.yml -> not reachable from outside.
listener 1883

# --- Public TLS listener: MQTT over TLS, published to host 8883 ---
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
